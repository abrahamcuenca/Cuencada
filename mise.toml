[tools]
node = "24"
pnpm = "11"

[env]
ANSIBLE_CONFIG = "../acleron-platform/acleron-platform/ansible.cfg"
ANSIBLE_VAULT_PASSWORD_FILE = "{{env.HOME}}/.acleron/.vault_pass"

[tasks.lint]
run = "pnpm lint"
description = "Lint with Biome"

[tasks.typecheck]
run = "pnpm typecheck"
description = "Type-check every package"

[tasks."test:db:up"]
run = "scripts/test-db.sh up"
description = "Start the disposable podman Postgres for tests (port 55432, tmpfs)"

[tasks."test:db:down"]
run = "scripts/test-db.sh down"
description = "Remove the disposable test Postgres container"

[tasks."test:db:status"]
run = "scripts/test-db.sh status"
description = "Report whether the test Postgres is up and ready"

[tasks.test]
depends = ["test:db:up"]
run = "pnpm test"
description = "Run the Vitest suites (starts the test Postgres first)"

[tasks.audit]
run = "pnpm audit --prod --audit-level=high"
description = "Fail on high/critical production dependency advisories"

[tasks.verify]
depends = ["lint", "typecheck", "test", "audit"]
description = "Pre-deploy quality gate"

[tasks.deploy-preflight]
run = "pnpm --filter @cuencada/server deploy:preflight"
description = "No secrets, no SSH: project.yml env vs config.ts, vault refs, build_env, nginx site vs csp.md"

[tasks.build-bundle]
depends = ["deploy-preflight"]
run = "bash ../acleron-platform/acleron-platform/scripts/build-bundle.sh --project-config $(pwd)/infra/project.yml"
description = "Preflight, then verify, build, migrate (owner role, tunnel) and pack an Acleron bundle"

[tasks.deploy]
depends = ["build-bundle"]
run = "ansible-playbook ../acleron-platform/acleron-platform/ansible/playbooks/deploy.yml -e project_config=$(pwd)/infra/project.yml -e artifact_bundle=$HOME/.acleron/bundles/cuencada/latest.tar.gz"
description = "Build a bundle, then deploy it to the VPS"

# Local and secret-free: safe to run anywhere, any time.
[tasks.deploy-check]
depends = ["deploy-preflight"]
run = ["pnpm build", "pnpm --filter @cuencada/web check:sw", "pnpm --filter @cuencada/web size"]
description = "Deploy gate without secrets: preflight, production build, service-worker rules, bundle size"

# Ansible --check against server_1 (needs the vault and SSH; changes nothing).
# No --diff: the diff of the rendered systemd unit would print every vault
# secret in its Environment= lines.
[tasks.deploy-dryrun]
run = "ansible-playbook ../acleron-platform/acleron-platform/ansible/playbooks/deploy.yml -e project_config=$(pwd)/infra/project.yml -e artifact_bundle=$HOME/.acleron/bundles/cuencada/latest.tar.gz --check"
description = "Dry-run deploy on server_1 (vault + SSH, no changes, no secret-printing diff)"
