name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cuencada
          POSTGRES_PASSWORD: cuencada
          POSTGRES_DB: cuencada_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cuencada -d cuencada_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://cuencada:cuencada@127.0.0.1:55432/cuencada_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json (pnpm 11).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
