<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic fonts for the Playwright mobile gates (WP-2.2). Chromium is
  launched with FONTCONFIG_FILE pointing here, so a local machine and the CI
  runner render the same glyph widths:
  - text: DejaVu Sans only (Ubuntu's default fallback, and wide: a
    pessimistic font for overflow checks); every other system font family in
    the CSS stack (Noto Sans, Roboto, Arial…) is unavailable;
  - emoji: Noto Color Emoji.
  Both come from Debian/Ubuntu packages (fonts-dejavu-core,
  fonts-noto-color-emoji) at the same paths locally and in CI.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir prefix="xdg">fontconfig-cuencada-e2e</cachedir>

  <selectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
    </acceptfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*Mono*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*Serif*</glob>
    </rejectfont>
  </selectfont>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
