<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic fonts for the Playwright suite (WP-2.2). Chromium is launched
  with FONTCONFIG_FILE pointing here, so a local machine and the CI runner
  render the same glyph widths:
  - text: DejaVu Sans (Book + Bold), **bundled in this directory** (license:
    DejaVu-LICENSE.txt), so the runner's font packages cannot change it.
    A CI run showed regular-weight text in a serif fallback while bold text
    matched, i.e. the system dejavu directory differed;
  - emoji: Noto Color Emoji from the system package (fonts-noto-color-emoji,
    too large to bundle); only that one file is accepted from its directory;
  - every family name in the CSS stacks resolves to DejaVu Sans (strong
    prepend), so no other installed font can be picked by name.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir prefix="xdg">fontconfig-cuencada-e2e</cachedir>

  <selectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
    </acceptfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
    </rejectfont>
  </selectfont>

  <!-- Every request tries DejaVu Sans first; glyphs it lacks fall back to Noto Color Emoji. -->
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
