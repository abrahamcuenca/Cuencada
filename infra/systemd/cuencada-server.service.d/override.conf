# systemd drop-in for cuencada-server.service (WP-2.4).
#
# Acleron renders /etc/systemd/system/cuencada-server.service on every deploy
# and has no hook for extra directives, but it never touches the drop-in
# directory. The owner installs this file once (docs/deploy/runbook.md, step 4):
#
#   sudo install -D -m 0644 override.conf /etc/systemd/system/cuencada-server.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart cuencada-server
#
# Verify with: systemctl show cuencada-server -p MemoryMax -p NoNewPrivileges -p ProtectSystem
# and systemd-analyze security cuencada-server (aim for "OK" or better).

[Unit]
# Crash-loop guard: after 5 failed starts in 5 minutes systemd stops trying
# (and the restart alert fires) instead of hammering Postgres and Resend.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# ---- Memory ---------------------------------------------------------------
# Sized for server_1 after its resize to 2 GB (owner decision, before launch;
# it had ~960 MB), shared with nine other Node services (~0.6-0.9 GB together).
# The API idles around 100-150 MB; a video job holds the whole file (150 MB
# cap; 300 MB would need ~300 MB more here) plus sharp's working set for
# images. MemoryHigh throttles and reclaims before MemoryMax OOM-kills the unit
# (Restart=on-failure brings it back; items interrupted mid-processing are
# marked failed, never re-run). Do NOT install these values on a 1 GB host.
MemoryHigh=700M
MemoryMax=900M
TasksMax=256

# ---- Privileges -----------------------------------------------------------
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
# NOT MemoryDenyWriteExecute: V8's JIT needs writable+executable pages.

# ---- Filesystem: the API writes nothing to disk (logs go to the journal) --
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
UMask=0077

# ---- Network: TCP to nginx/Postgres/S3/Resend, plus DNS -------------------
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
