# cuencada.com: complete nginx site (WP-2.4).
#
# Installed as /etc/nginx/sites-available/cuencada. See docs/deploy/nginx.md for
# how it gets there: Acleron's stock template can't express this site (chat
# WebSocket under /api, the SPA CSP, the redacted access log, X-Forwarded-For
# overwrite), so Acleron renders this file instead (`nginx.site_template`,
# platform branch cuencada-nginx-credentials).
#
# The file contains no template markers, so it is valid both as a plain nginx
# file and as a Jinja template. Keep it that way: the deploy preflight
# (`mise run deploy-preflight`) checks it against infra/project.yml and
# docs/security/csp.md, and fails on drift.
#
# Not behind Cloudflare: TLS ends here, $remote_addr is the real client, and
# no CF-* or forwarding header from the client is ever trusted or passed on.
#
# The site file is included inside http{}, so everything above the first
# server{} block is http-level. Every name is prefixed with cuencada_ because
# maps, log formats and zones share one namespace across all sites on the host.

# ---------------------------------------------------------------------------
# Access log without query strings [SEC]
# ---------------------------------------------------------------------------
# The path is logged without its query string, so ?ticket= (chat), ?q= /
# ?search= / ?city= (the directory and family search) and any future parameter
# never reach the log. $request (the raw request line), $request_uri and $args
# are deliberately not used in the format. The path comes from the original
# request (not $uri, which reads /index.html after the SPA fallback). The
# Referer is cut at the first ? or # too: same-origin navigations send the full
# URL (Referrer-Policy strict-origin-when-cross-origin), query string included.
map $request_uri $cuencada_request_path {
    default                  "-";
    "~^(?<cuencada_path>[^?#]*)"  $cuencada_path;
}

map $http_referer $cuencada_referer {
    default                  $http_referer;
    "~^(?<cuencada_ref>[^?#]*)[?#]"  $cuencada_ref;
}

log_format cuencada_redacted '$remote_addr - [$time_local] "$request_method $cuencada_request_path $server_protocol" '
                             '$status $body_bytes_sent "$cuencada_referer" "$http_user_agent" '
                             'rt=$request_time urt=$upstream_response_time';

# ---------------------------------------------------------------------------
# Caching of static files (one table, so no location needs its own header)
# ---------------------------------------------------------------------------
# $uri is the final URI: an SPA route that falls back to /index.html maps as
# /index.html. The service worker, its imported script, the manifest and the
# HTML shell must be revalidated on every update check (WP-T9).
map $uri $cuencada_cache_control {
    default                                    "no-cache";
    "~^/assets/"                               "public, max-age=31536000, immutable";
    "~^/workbox-[A-Za-z0-9_-]+\.js$"           "public, max-age=31536000, immutable";
    "~^/(icons|images|canciones)/"             "public, max-age=86400";
}

# Old public URLs of the legacy static site (retired at cutover).
# /index.html is NOT redirected: it is the SPA shell, and Workbox precaches it
# as /index.html?__WB_REVISION__=…, which must answer 200.
map $request_uri $cuencada_legacy_redirect {
    default                                    "";
    "~^/cuencada2026\.html(?:[?#].*)?$"        "/cuencada/2026";
    "~^/mensajes\.(?:txt|json)(?:[?#].*)?$"    "/";
    "~^/images/fotos/"                         "/";
}

# ---------------------------------------------------------------------------
# Backstop rate limits (the API has its own per-IP and per-user limits)
# ---------------------------------------------------------------------------
# Keyed on $binary_remote_addr: the direct client address (no CDN in front).
limit_req_zone  $binary_remote_addr zone=cuencada_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cuencada_ws:10m;

# ---------------------------------------------------------------------------
# HTTP: ACME challenges, everything else to the HTTPS apex
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name cuencada.com www.cuencada.com;

    access_log /var/log/nginx/cuencada-access.log cuencada_redacted;
    error_log  /var/log/nginx/cuencada-error.log error;

    location /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://cuencada.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS www: one canonical origin (CORS and the CSRF Origin check allow only
# https://cuencada.com, so the app must never be served on www)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.cuencada.com;

    ssl_certificate     /etc/letsencrypt/live/cuencada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuencada.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/cuencada-access.log cuencada_redacted;
    error_log  /var/log/nginx/cuencada-error.log error;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://cuencada.com$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS apex: the SPA, the API and the chat socket
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name cuencada.com;

    ssl_certificate     /etc/letsencrypt/live/cuencada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuencada.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP URL.

    server_tokens off;

    access_log /var/log/nginx/cuencada-access.log cuencada_redacted;
    # Error-log lines can quote the request line (query string included) on
    # upstream failures; keep the level at error and the file root/adm 0640.
    error_log  /var/log/nginx/cuencada-error.log error;

    # API bodies are JSON (Fastify's limit is 1 MiB). Photos and videos go
    # straight to the bucket through presigned PUTs and never cross nginx.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    root  /srv/cuencada/web/current;
    index index.html;

    if ($cuencada_legacy_redirect) {
        return 301 $cuencada_legacy_redirect;
    }

    # --- API (Fastify on loopback; helmet sets the API's own headers) -------
    # ^~ keeps the static-file regex below from ever matching an API path.
    location ^~ /api/ {
        limit_req zone=cuencada_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite, never append: the app trusts only loopback (trustProxy),
        # and this is the one hop it sees.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Client-supplied forwarding headers are dropped, not passed through.
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   Forwarded         "";
        proxy_set_header   CF-Connecting-IP  "";
        proxy_set_header   True-Client-IP    "";
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # --- Chat WebSocket: GET /api/chat/ws?ticket=… ---------------------------
    # The server pings every 25 s; 75 s tolerates two lost pings before nginx
    # closes an idle socket. The ticket in the query string is single-use
    # (30 s) and never logged (see log_format above).
    location = /api/chat/ws {
        limit_conn cuencada_ws 10;

        proxy_pass         http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   Forwarded         "";
        proxy_set_header   CF-Connecting-IP  "";
        proxy_set_header   True-Client-IP    "";
        proxy_buffering    off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
        proxy_send_timeout    75s;
    }

    # --- Liveness only (process up, no DB). /health/ready stays loopback-only:
    # check it over SSH with curl http://127.0.0.1:3104/health/ready.
    location = /healthz {
        access_log off;
        proxy_pass         http://127.0.0.1:3104/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  "";
        proxy_set_header   Forwarded         "";
        proxy_set_header   CF-Connecting-IP  "";
        proxy_set_header   True-Client-IP    "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # --- Static files: a path with an extension is a real file or a 404 ------
    # (never the HTML shell, so a stale client asking for an old chunk gets a
    # clean 404 instead of HTML served as JavaScript).
    #
    # Security headers: nginx drops inherited add_header lines in any location
    # that sets its own, so each static location carries the full set. The
    # CSP is docs/security/csp.md's policy, verbatim, with the bucket filled
    # in; the preflight fails if any copy differs.
    location ~ "\.[A-Za-z0-9]{2,12}$" {
        try_files $uri =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://<bucket>.us-southeast-1.linodeobjects.com; media-src 'self' blob: https://<bucket>.us-southeast-1.linodeobjects.com; connect-src 'self' wss://cuencada.com https://<bucket>.us-southeast-1.linodeobjects.com; font-src 'self'; frame-src https://weatherwidget.io; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control $cuencada_cache_control always;
    }

    # --- PWA manifest: nginx's mime.types has no .webmanifest entry ----------
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://<bucket>.us-southeast-1.linodeobjects.com; media-src 'self' blob: https://<bucket>.us-southeast-1.linodeobjects.com; connect-src 'self' wss://cuencada.com https://<bucket>.us-southeast-1.linodeobjects.com; font-src 'self'; frame-src https://weatherwidget.io; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control $cuencada_cache_control always;
    }

    # --- App routes: anything else renders the SPA shell ---------------------
    location / {
        try_files $uri /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://<bucket>.us-southeast-1.linodeobjects.com; media-src 'self' blob: https://<bucket>.us-southeast-1.linodeobjects.com; connect-src 'self' wss://cuencada.com https://<bucket>.us-southeast-1.linodeobjects.com; font-src 'self'; frame-src https://weatherwidget.io; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control $cuencada_cache_control always;
    }
}
